name: Build unsigned iPhone IPA
on: workflow_dispatch

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.runtime.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: runtime
        run: |
          hash=$(npx --no-install expo-updates runtimeversion:resolve --platform ios --workflow managed | jq -er .runtimeVersion)
          [[ "$hash" =~ ^[a-f0-9]{40}$ ]]
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
  build:
    needs: runtime
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.runtime.outputs.hash }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate iOS project and install pods
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Compile Release for iPhone
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/Siftwake.xcworkspace -scheme Siftwake \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify unsigned IPA
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/Siftwake.app"
          test -s "$app/main.jsbundle"
          fingerprint=$(find "$app" -path '*/EXUpdates.bundle/fingerprint' -print -quit)
          test "$(cat "$fingerprint")" = "$EXPO_UPDATES_FINGERPRINT_OVERRIDE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$app/Expo.plist")" = production
          cp "$fingerprint" "$RUNNER_TEMP/ios-runtime.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/Siftwake.app"
          cd "$RUNNER_TEMP/package"
          # Prebuilt libraries can carry a vendor or linker-generated ad-hoc signature.
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              if codesign -d "$binary" 2>/dev/null; then
                codesign --remove-signature "$binary"
              fi
              if codesign -d "$binary" 2>/dev/null; then exit 1; fi
            fi
          done < <(find Payload -type f -print0)
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          test -z "$(find Payload -name embedded.mobileprovision -print)"
          ditto -c -k --norsrc --keepParent Payload "$RUNNER_TEMP/Siftwake-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/Siftwake-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Siftwake-unsigned
          path: ${{ runner.temp }}/Siftwake-unsigned.ipa
          if-no-files-found: error

      - name: Release unsigned IPA and compatibility fingerprint
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --target "$GITHUB_SHA" --latest \
            --title "Siftwake $(node -p 'require("./app.json").expo.version') for iPhone" \
            --notes "Unsigned device IPA. Production OTA runtime $(cat "$RUNNER_TEMP/ios-runtime.txt")." \
            "$RUNNER_TEMP/Siftwake-unsigned.ipa" "$RUNNER_TEMP/ios-runtime.txt"

  livecontainer-source:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/livecontainer-source.yml
