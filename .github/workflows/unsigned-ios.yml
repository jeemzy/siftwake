name: Build unsigned iPhone IPA
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate iOS project and install pods
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Compile Release for iPhone
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/Siftwake.xcworkspace -scheme Siftwake \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify unsigned IPA
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/Siftwake.app"
          test -s "$app/main.jsbundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/Siftwake.app"
          cd "$RUNNER_TEMP/package"
          # Prebuilt libraries can carry a vendor or linker-generated ad-hoc signature.
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              if codesign -d "$binary" 2>/dev/null; then
                codesign --remove-signature "$binary"
              fi
              if codesign -d "$binary" 2>/dev/null; then exit 1; fi
            fi
          done < <(find Payload -type f -print0)
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          test -z "$(find Payload -name embedded.mobileprovision -print)"
          ditto -c -k --norsrc --keepParent Payload "$RUNNER_TEMP/Siftwake-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/Siftwake-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Siftwake-unsigned
          path: ${{ runner.temp }}/Siftwake-unsigned.ipa
          if-no-files-found: error
